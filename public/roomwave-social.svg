<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<title>Roomwave</title><desc>Real-time chat rooms where a removal reaches every open tab, with peer-to-peer video calls for members. A Django chat app with public and private rooms.</desc>
