<g font-family="Segoe UI,Arial,sans-serif"><text x="136" y="135" fill="#3b5bdb" font-family="Consolas,monospace" font-weight="700" font-size="23" letter-spacing="1">ROOMS · INVITATIONS · CALLS</text>
<text x="132" y="236" fill="#202020" font-weight="700" font-size="76">roomwave</text>
<text x="136" y="305" fill="#424242" font-size="29">Real-time rooms where a removal reaches</text><text x="136" y="349" fill="#424242" font-size="29">every open tab, with calls for members.</text>
