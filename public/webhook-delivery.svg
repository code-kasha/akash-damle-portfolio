<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>Webhook Delivery flow</title><desc>Publish an event, save durable jobs, send a signed request and record the attempt. Failed requests wait for retry.</desc><rect width="1280" height="800" fill="#103e35"/><rect x="48" y="48" width="1184" height="704" rx="14" fill="#f9fbfa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="96" y="122" fill="#17816e" font-size="22" letter-spacing="3">NODE.JS / TYPESCRIPT / POSTGRESQL</text><text x="92" y="211" fill="#202020" font-size="70" font-weight="700">Webhook Delivery</text><text x="96" y="269" fill="#424242" font-size="28">Durable work. Signed requests. Visible outcomes.</text><g fill="#fff" stroke="#b5cfc6" stroke-width="2"><rect x="96" y="350" width="280" height="180" rx="12"/><rect x="500" y="350" width="280" height="180" rx="12"/><rect x="904" y="350" width="280" height="180" rx="12"/></g><g fill="#172124" font-size="32" font-weight="700"><text x="129" y="414">Publish</text><text x="533" y="414">Persist</text><text x="937" y="414">Deliver</text></g><g fill="#52635d" font-size="23"><text x="129" y="460">Scoped API key</text><text x="129" y="495">Idempotency key</text><text x="533" y="460">Event + jobs + audit</text><text x="533" y="495">One transaction</text><text x="937" y="460">HMAC signature</text><text x="937" y="495">Fenced lease</text></g><path d="M389 440H479M793 440H883" stroke="#17816e" stroke-width="5"/><path d="m466 428 13 12-13 12m404-24 13 12-13 12" fill="none" stroke="#17816e" stroke-width="5"/><path d="M1044 550V599H640V550" stroke="#17816e" stroke-width="3" fill="none"/><text x="713" y="640" font-size="24" fill="#17816e">Retry after a failed attempt</text><text x="96" y="706" font-size="22" fill="#52635d">At-least-once delivery · Attempt history · Pause and replay</text></g></svg>